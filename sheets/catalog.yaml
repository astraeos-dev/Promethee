# a déjà une fiche (même identifiant que sheets/<id>.md), la fiche liée.
#
# Clés : id, name, category, manufacturer, part_number, package (boîtier), value (valeur),
# values (valeurs proposées), description, dimensions, links (fiche technique, documentation).
# Les liens sont vérifiés par la CI (tools/check_links.py, workflow Links).

