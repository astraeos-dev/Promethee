# Liste non exhaustive de matériel courant, proposée par « Demander une fiche ».
# Chaque appareil ouvre le formulaire de demande GitHub (.github/ISSUE_TEMPLATE/fiche.yml)
# avec ses champs déjà remplis. Cette liste ne contient aucune fiche : les fiches sont
# écrites au fur et à mesure des demandes, sous l'identifiant de l'appareil
# (sheets/<id>.md), et l'appareil renvoie alors vers sa fiche.
#
# Clés : id (identifiant de la future fiche), name, category, manufacturer, part_number,
# description (une ligne), dimensions (si connues), links (fiche technique, documentation).
# Les liens sont vérifiés par la CI (tools/check_links.py).

