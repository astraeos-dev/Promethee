name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t promethee:ci .
      - name: Container starts
        run: |
          docker run -d --name promethee -p 8000:8000 promethee:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/api/health && exit 0; sleep 1; done
          docker logs promethee; exit 1
