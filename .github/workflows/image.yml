name: Image

# Publie l'image multi-architecture utilisée par le module Home Assistant
# (et par Docker Compose) : ghcr.io/astraeos-dev/promethee:<version> et :latest.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('app/__init__.py').read())[1])")
          grep -q "^version: \"$version\"" promethee/config.yaml || { echo "promethee/config.yaml n'est pas en version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/astraeos-dev/promethee:${{ steps.version.outputs.version }}
            ghcr.io/astraeos-dev/promethee:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
