# A non-exhaustive list of common components, suggested by the "Name" field when creating a new item:
# Selecting a name automatically populates the category, value, package, and part number;
# if the component already has an associated datasheet (matching the identifier in sheets/<id>.md), that file is linked as well.
#
# Keys: id, name, category, manufacturer, part_number, package, value,
# values (suggested values), description, dimensions, links (datasheet, documentation).
# Links are verified by the CI process (via tools/check_links.py, in the "Links" workflow).

