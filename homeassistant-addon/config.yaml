name: Prométhée
version: "0.5.1"
slug: promethee
description: Stock of electronic components and datasheets with 3D view.
url: https://github.com/astraeos-dev/Promethee
arch:
  - aarch64
  - amd64
# Multi-arch image published by .github/workflows/image.yml.
image: ghcr.io/astraeos-dev/promethee
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8000
panel_icon: mdi:chip
panel_title: Prométhée
homeassistant_api: true
watchdog: http://[HOST]:[PORT:8000]/api/health
environment:
  PROMETHEE_DB_DIR: /data
ports:
  8000/tcp: null
ports_description:
  8000/tcp: Direct access without going through Home Assistant (disabled by default, no authentication)
